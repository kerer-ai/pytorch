name: Build build/test Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Single image tag to build (without timestamp). Leave empty to build all.'
        required: false
        type: string
      cann_share_url:
        description: 'OBS e-share link for CANN run packages (https://e-share.obs-website...?v2token=...). Leave empty to use the public CANN repo.'
        required: false
        type: string
      cann_share_code:
        description: 'Access code (提取码) for the OBS share link. Required when cann_share_url is set.'
        required: false
        type: string

env:
  REGISTRY: swr.cn-north-4.myhuaweicloud.com
  SWR_ORG: frameworkptadapter
  IMAGE_NAME: pytorch

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.set.outputs.tags }}
    steps:
      - id: set
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAGS='["${{ inputs.tag }}"]'
          else
            TAGS='["torch-npu-builder-x86_64-torch-master","torch-npu-builder-aarch64-torch-master","torch-npu-test-x86_64-cann-a1-py3.10-torch-master","torch-npu-test-x86_64-cann-a2-py3.10-torch-master","torch-npu-test-x86_64-cann-a3-py3.10-torch-master","torch-npu-test-x86_64-cann-a5-py3.10-torch-master","torch-npu-test-aarch64-cann-a1-py3.10-torch-master","torch-npu-test-aarch64-cann-a2-py3.10-torch-master","torch-npu-test-aarch64-cann-a3-py3.10-torch-master","torch-npu-test-aarch64-cann-a5-py3.10-torch-master"]'
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

  build:
    needs: matrix
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.matrix.outputs.tags) }}
    runs-on: ${{ contains(matrix.tag, 'x86_64') && 'ubuntu-latest' || 'ubuntu-22.04-arm' }}
    env:
      PUSH_IMAGE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache
          docker system prune -af
          sudo apt clean && sudo apt autoremove -y
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install obsutil for CANN share downloads
        if: inputs.cann_share_url != ''
        run: |
          sudo bash .ci/docker/common/install_obs.sh
          # Harden PATH in case /usr/local/bin is not present for step shells.
          export PATH="/usr/local/bin:$PATH"
          ls -la /usr/local/bin/obsutil
          obsutil version

      - name: Log in to SWR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push image
        env:
          OBS_SHARE_URL: ${{ inputs.cann_share_url }}
          OBS_ACCESS_CODE: ${{ inputs.cann_share_code }}
        run: |
          export PATH="/usr/local/bin:$PATH"
          TIMESTAMP=$(date -u +%Y%m%d%H%M)
          cd .ci/docker
          chmod +x ./docker_build.sh
          TIMESTAMP=${TIMESTAMP} TAG_OUT=/tmp/image_tag.txt ./docker_build.sh ${{ matrix.tag }}

          # docker_build.sh resolves the final tag (test images always carry
          # a -cann<version> suffix).
          IMAGE_TAG=$(cat /tmp/image_tag.txt)
          IMAGE_SIZE=$(docker image inspect "${IMAGE_TAG}" --format '{{.Size}}')
          mkdir -p /tmp/result
          if [[ "${PUSH_IMAGE}" == "true" ]]; then
            REMOTE_IMAGE="${{ env.REGISTRY }}/${{ env.SWR_ORG }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
            docker tag "${IMAGE_TAG}" "${REMOTE_IMAGE}"
            docker push "${REMOTE_IMAGE}"
            echo "${REMOTE_IMAGE} ${IMAGE_SIZE}" > "/tmp/result/${{ matrix.tag }}.txt"
            echo "Pushed ${REMOTE_IMAGE} ($(numfmt --to=iec-i --suffix=B ${IMAGE_SIZE} 2>/dev/null || echo ${IMAGE_SIZE}B))"
          else
            echo "Fork PR or no secrets — build only, skipping push"
            echo "build-only: ${{ matrix.tag }} ${IMAGE_SIZE}" > "/tmp/result/${{ matrix.tag }}.txt"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.tag }}
          path: /tmp/result/${{ matrix.tag }}.txt
          retention-days: 1

  summary:
    needs: [matrix, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: /tmp/results
          merge-multiple: true

      - name: Generate summary
        run: |
          echo "## Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | Image | Size | Pull Command |" >> $GITHUB_STEP_SUMMARY
          echo "|---|-------|------|-------------|" >> $GITHUB_STEP_SUMMARY

          if [ -d /tmp/results ] && [ "$(ls -A /tmp/results 2>/dev/null)" ]; then
            COUNT=1
            TOTAL_SIZE=0
            for f in /tmp/results/*.txt; do
              IMAGE=$(awk '{print $1}' "$f")
              SIZE=$(awk '{print $2}' "$f")
              if [ -n "${SIZE}" ] && [ "${SIZE}" -eq "${SIZE}" ] 2>/dev/null; then
                SIZE_HR=$(numfmt --to=iec-i --suffix=B "${SIZE}" 2>/dev/null || echo "${SIZE} B")
                TOTAL_SIZE=$((TOTAL_SIZE + SIZE))
              else
                SIZE_HR="-"
              fi
              echo "| ${COUNT} | \`${IMAGE##*:}\` | ${SIZE_HR} | \`docker pull ${IMAGE}\` |" >> $GITHUB_STEP_SUMMARY
              COUNT=$((COUNT + 1))
            done
            TOTAL_HR=$(numfmt --to=iec-i --suffix=B "${TOTAL_SIZE}" 2>/dev/null || echo "${TOTAL_SIZE} B")
            echo "| | **Total ($((COUNT - 1)) images)** | **${TOTAL_HR}** | |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| - | No images built | - | - |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}/${{ env.SWR_ORG }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
